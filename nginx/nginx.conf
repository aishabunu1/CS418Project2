# =============================================================================
# nginx.conf — NGINX for DASH live streaming + static web hosting
#
# Usage: nginx -c /path/to/this/nginx.conf
# Or place in /etc/nginx/sites-available/ and symlink to sites-enabled/
# =============================================================================

# ---- Paths (override via environment or edit here) --------------------------
# These match the defaults in config.sh
# DASH segments:  ${PROJECT_ROOT}/dash_output/
# Web root:       ${PROJECT_ROOT}/web/
# -----------------------------------------------------------------------------

worker_processes auto;
error_log logs/nginx_error.log warn;
pid       logs/nginx.pid;

events {
    worker_connections 1024;
    use epoll;               # Linux: most efficient I/O model
    multi_accept on;
}

http {
    include      mime.types;
    default_type application/octet-stream;

    # Custom MIME types needed for DASH
    types {
        application/dash+xml       mpd;
        video/mp4                  mp4 m4s m4v;
        audio/mp4                  m4a;
        application/mp4            mp4;
        text/html                  html htm;
        text/css                   css;
        application/javascript     js;
        image/jpeg                 jpg jpeg;
        image/png                  png;
        application/json           json;
    }

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Logging
    log_format dash_log '$remote_addr - [$time_local] "$request" '
                         '$status $body_bytes_sent "$http_referer" '
                         '"$http_user_agent" rt=$request_time';

    access_log logs/nginx_access.log dash_log;

    # Gzip (don't compress binary media — only text/JSON/MPD)
    gzip on;
    gzip_types application/dash+xml application/json text/html text/css application/javascript;
    gzip_min_length 1024;

    server {
        listen      8080;        # Port from config.sh HTTP_PORT
        server_name localhost;

        # ----- CORS headers (required for cross-origin DASH player) ----------
        add_header 'Access-Control-Allow-Origin'  '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Range, Origin, X-Requested-With, Content-Type, Accept' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range' always;

        # Handle CORS preflight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'  '*';
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Length' 0;
            return 204;
        }

        # ----- Web player (HTML5 page + assets) ------------------------------
        root   REPLACE_WITH_PROJECT_ROOT/web;
        index  index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        # ----- DASH live output (MPD + segments) -----------------------------
        location /dash/ {
            alias REPLACE_WITH_PROJECT_ROOT/dash_output/;

            # MPD manifest — must not be cached (live, changes every segment)
            location ~* \.mpd$ {
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Pragma "no-cache";
                add_header Expires "0";
                add_header 'Access-Control-Allow-Origin' '*' always;
            }

            # Initialization segments (.mp4) — cache briefly
            location ~* \.mp4$ {
                add_header Cache-Control "max-age=60";
                add_header 'Access-Control-Allow-Origin' '*' always;
            }

            # Media segments (.m4s) — cache briefly (they are immutable once written)
            location ~* \.m4s$ {
                add_header Cache-Control "max-age=60";
                add_header 'Access-Control-Allow-Origin' '*' always;
            }

            # Byte-range requests (needed for time-shifting / seeking)
            add_header Accept-Ranges bytes;

            autoindex on;     # Helpful during development; disable in production
        }

        # ----- Snapshots (motion detection screenshots) ----------------------
        location /snapshots/ {
            alias REPLACE_WITH_PROJECT_ROOT/dash_output/snapshots/;
            add_header 'Access-Control-Allow-Origin' '*' always;
        }

        # ----- Motion alerts JSON feed ---------------------------------------
        location /motion_alerts.json {
            alias REPLACE_WITH_PROJECT_ROOT/dash_output/motion_alerts.json;
            add_header Cache-Control "no-cache";
            add_header 'Access-Control-Allow-Origin' '*' always;
        }

        # ----- Health check endpoint -----------------------------------------
        location /health {
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }
    }
}
