worker_processes auto;
error_log logs/nginx_error.log warn;
pid       logs/nginx.pid;

events {
    worker_connections 1024;
    use epoll;              
    multi_accept on;
}

http {
    include      mime.types;
    default_type application/octet-stream;

    types {
        application/dash+xml       mpd;
        video/mp4                  mp4 m4s m4v;
        audio/mp4                  m4a;
        application/mp4            mp4;
        text/html                  html htm;
        text/css                   css;
        application/javascript     js;
        image/jpeg                 jpg jpeg;
        image/png                  png;
        application/json           json;
    }

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;


    log_format dash_log '$remote_addr - [$time_local] "$request" '
                         '$status $body_bytes_sent "$http_referer" '
                         '"$http_user_agent" rt=$request_time';

    access_log logs/nginx_access.log dash_log;

    gzip on;
    gzip_types application/dash+xml application/json text/html text/css application/javascript;
    gzip_min_length 1024;

    server {
        listen      8080;        
        server_name localhost;

        
        add_header 'Access-Control-Allow-Origin'  '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Range, Origin, X-Requested-With, Content-Type, Accept' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range' always;

        
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'  '*';
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Length' 0;
            return 204;
        }

       
        root   REPLACE_WITH_PROJECT_ROOT/web;
        index  index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        
        location /dash/ {
            alias REPLACE_WITH_PROJECT_ROOT/dash_output/;

            
            location ~* \.mpd$ {
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Pragma "no-cache";
                add_header Expires "0";
                add_header 'Access-Control-Allow-Origin' '*' always;
            }

            
            location ~* \.mp4$ {
                add_header Cache-Control "max-age=60";
                add_header 'Access-Control-Allow-Origin' '*' always;
            }

            
            location ~* \.m4s$ {
                add_header Cache-Control "max-age=60";
                add_header 'Access-Control-Allow-Origin' '*' always;
            }

            
            add_header Accept-Ranges bytes;

            autoindex on;     
        }

        
        location /snapshots/ {
            alias REPLACE_WITH_PROJECT_ROOT/dash_output/snapshots/;
            add_header 'Access-Control-Allow-Origin' '*' always;
        }

        
        location /motion_alerts.json {
            alias REPLACE_WITH_PROJECT_ROOT/dash_output/motion_alerts.json;
            add_header Cache-Control "no-cache";
            add_header 'Access-Control-Allow-Origin' '*' always;
        }

        
        location /health {
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }
    }
}
