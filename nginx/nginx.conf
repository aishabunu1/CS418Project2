<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H&A — Live Camera</title>
<!--
  FIX #1 (hard-coded paths): dash.js is loaded from a local copy (dash.all.min.js
  must sit next to this file). The MPD URL and segment duration are NEVER
  hard-coded — they come from URL query params or sensible fallbacks:
    ?mpd=dash/manifest.mpd   override manifest path
    ?seg=4                    override segment duration display
-->
<script src="dash.all.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --pink-50:#fff0f5;--pink-100:#ffd6e7;--pink-200:#ffb3ce;--pink-300:#ff85b3;--pink-400:#f56098;
  --blue-50:#f0f6ff;--blue-100:#d6e8ff;--blue-200:#aecfff;--blue-300:#7eb3ff;--blue-400:#4d8ef0;
  --cream:#fefcfa;--white:#ffffff;--border:rgba(180,160,175,0.2);--bmd:rgba(180,160,175,0.35);
  --sh-sm:0 2px 12px rgba(180,120,160,0.08);--sh-md:0 8px 32px rgba(180,120,160,0.12);--sh-lg:0 20px 60px rgba(180,120,160,0.18);
  --text:#2d2230;--text-mid:#7a6878;--text-lt:#b3a4b0;
  --r-sm:8px;--r-md:14px;--r-lg:20px;--r-xl:28px;--r-pill:100px;
  --ff-d:'Cormorant Garamond',Georgia,serif;--ff-u:'Manrope',system-ui,sans-serif;
  --ease:0.2s cubic-bezier(0.4,0,0.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:var(--ff-u);font-size:13px;background:var(--cream);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden;}
.shell{min-height:100vh;display:grid;grid-template-rows:62px 1fr;}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:rgba(255,255,255,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;}
.logo{display:flex;align-items:center;gap:10px;}
.logo-mark{width:34px;height:34px;background:linear-gradient(135deg,var(--pink-200),var(--blue-200));border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;}
.logo-mark svg{width:18px;height:18px;}
.logo-name{font-family:var(--ff-d);font-size:22px;font-weight:600;letter-spacing:-0.01em;color:var(--text);}
.logo-sub{font-size:10px;color:var(--text-lt);letter-spacing:0.05em;display:block;margin-top:-2px;}
.hdr-pills{display:flex;align-items:center;gap:8px;}
.pill{display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:var(--r-pill);font-size:11px;font-weight:500;border:1px solid var(--border);background:var(--white);color:var(--text-mid);}
.pdot{width:6px;height:6px;border-radius:50%;background:var(--text-lt);flex-shrink:0;}
.pdot.live{background:var(--pink-300);box-shadow:0 0 0 3px var(--pink-100);animation:pp 1.4s ease infinite;}
.pdot.ok{background:#7ecba1;}
@keyframes pp{0%,100%{opacity:1}50%{opacity:.4}}
.hdr-clock{font-family:var(--ff-d);font-size:19px;font-weight:300;color:var(--text-mid);letter-spacing:0.02em;margin-left:8px;padding-left:16px;border-left:1px solid var(--bmd);}
.body{display:grid;grid-template-columns:1fr 296px;height:calc(100vh - 62px);overflow:hidden;}
.left{display:flex;flex-direction:column;padding:22px 18px 22px 26px;gap:14px;overflow:hidden;}
.vc{position:relative;flex:1;background:#160e1a;border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--sh-lg);}
#vp{width:100%;height:100%;object-fit:contain;display:block;}
.cn{position:absolute;width:18px;height:18px;z-index:10;pointer-events:none;}
.cn::before,.cn::after{content:'';position:absolute;background:rgba(255,255,255,0.45);border-radius:1px;}
.cn-tl{top:13px;left:13px;}.cn-tl::before{width:2px;height:100%}.cn-tl::after{width:100%;height:2px}
.cn-tr{top:13px;right:13px;}.cn-tr::before{width:2px;height:100%;right:0}.cn-tr::after{width:100%;height:2px}
.cn-bl{bottom:68px;left:13px;}.cn-bl::before{width:2px;height:100%}.cn-bl::after{width:100%;height:2px;bottom:0}
.cn-br{bottom:68px;right:13px;}.cn-br::before{width:2px;height:100%;right:0}.cn-br::after{width:100%;height:2px;bottom:0}
.vtop{position:absolute;top:0;left:0;right:0;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(to bottom,rgba(18,8,22,.65) 0%,transparent 100%);}
.rec-tag{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.9);background:rgba(245,96,152,.3);border:1px solid rgba(255,133,179,.35);padding:4px 11px;border-radius:var(--r-pill);opacity:0;transition:opacity var(--ease);}
.rec-tag.on{opacity:1;}
.rdot{width:6px;height:6px;border-radius:50%;background:var(--pink-200);animation:pp 1.4s ease infinite;}
.qtag{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.7);background:rgba(126,179,255,.2);border:1px solid rgba(126,179,255,.28);padding:4px 11px;border-radius:var(--r-pill);}
.vosd{position:absolute;bottom:66px;left:18px;font-size:10px;letter-spacing:.07em;color:rgba(255,255,255,.4);pointer-events:none;z-index:5;}
.mflash{position:absolute;inset:0;border:2px solid rgba(245,96,152,.6);border-radius:var(--r-xl);opacity:0;transition:opacity .1s;pointer-events:none;z-index:8;}
.mflash.on{opacity:1;}
.vload{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(18,8,22,.88);z-index:20;border-radius:var(--r-xl);transition:opacity .3s;}
.vload.gone{opacity:0;pointer-events:none;}
.lring{width:38px;height:38px;border:2px solid rgba(255,255,255,.1);border-top-color:var(--pink-200);border-right-color:var(--blue-200);border-radius:50%;animation:spin 1.1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.ltxt{font-size:11px;color:rgba(255,255,255,.4);letter-spacing:.06em;}
.cbar{position:absolute;bottom:0;left:0;right:0;padding:10px 16px 14px;background:linear-gradient(to top,rgba(18,8,22,.88) 0%,transparent 100%);z-index:15;display:flex;flex-direction:column;gap:9px;}
.pwrap{width:100%;height:3px;background:rgba(255,255,255,.12);border-radius:2px;cursor:pointer;position:relative;transition:height .15s,margin .15s;}
.pwrap:hover{height:5px;margin-top:-1px;}
.pbuf,.pfill{position:absolute;top:0;left:0;height:100%;border-radius:2px;width:0%;}
.pbuf{background:rgba(255,255,255,.14);}
.pfill{background:linear-gradient(to right,var(--pink-200),var(--blue-200));}
.pthumb{position:absolute;right:-5px;top:50%;transform:translateY(-50%);width:11px;height:11px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);opacity:0;transition:opacity .15s;}
.pwrap:hover .pthumb{opacity:1;}
.stip{position:absolute;bottom:10px;background:rgba(18,8,22,.9);border:1px solid rgba(255,255,255,.12);padding:3px 8px;font-size:10px;color:rgba(255,255,255,.85);border-radius:var(--r-sm);pointer-events:none;transform:translateX(-50%);white-space:nowrap;display:none;}
.pwrap:hover .stip{display:block;}
.crow{display:flex;align-items:center;gap:7px;}
.cb{display:flex;align-items:center;gap:4px;padding:6px 12px;border-radius:var(--r-pill);border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:rgba(255,255,255,.85);font-family:var(--ff-u);font-size:11px;font-weight:500;letter-spacing:.03em;cursor:pointer;transition:background var(--ease),border-color var(--ease);white-space:nowrap;flex-shrink:0;}
.cb:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.28);}
.cb.pk{background:rgba(255,181,200,.2);border-color:rgba(255,181,200,.35);color:var(--pink-100);}
.cb.pk:hover{background:rgba(255,181,200,.32);}
.cb.bl{background:rgba(174,207,255,.2);border-color:rgba(174,207,255,.3);color:var(--blue-100);}
.skwrap{display:flex;align-items:center;border:1px solid rgba(255,255,255,.15);border-radius:var(--r-pill);overflow:hidden;background:rgba(255,255,255,.06);}
.skwrap input{background:transparent;border:none;outline:none;color:rgba(255,255,255,.8);font-family:var(--ff-u);font-size:11px;width:52px;padding:6px 10px;text-align:center;}
.skwrap input::placeholder{color:rgba(255,255,255,.28);}
.skgo{padding:6px 10px;background:rgba(255,255,255,.08);border:none;border-left:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.6);cursor:pointer;font-size:12px;transition:background var(--ease);}
.skgo:hover{background:rgba(255,255,255,.16);color:#fff;}
.ttxt{font-size:10px;color:rgba(255,255,255,.4);letter-spacing:.04em;}
.csp{flex:1;}
input[type=range].vol{-webkit-appearance:none;width:58px;height:3px;background:rgba(255,255,255,.15);border-radius:2px;outline:none;cursor:pointer;flex-shrink:0;}
input[type=range].vol::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.7);cursor:pointer;}
.tpanel{background:var(--white);border-radius:var(--r-lg);border:1px solid var(--border);box-shadow:var(--sh-sm);padding:14px 18px;}
.thdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;}
.tlabel{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--text-lt);}
.ttime{font-family:var(--ff-d);font-size:14px;font-weight:300;color:var(--text-mid);}
.tstrip{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.tstrip::-webkit-scrollbar{display:none;}
.thumb{flex-shrink:0;width:70px;height:40px;border-radius:var(--r-sm);background:var(--pink-50);border:1.5px solid var(--border);cursor:pointer;position:relative;overflow:hidden;transition:border-color var(--ease),transform var(--ease);}
.thumb:hover{border-color:var(--pink-200);transform:scale(1.04);}
.thumb.on{border-color:var(--pink-300);}
.thumb canvas{width:100%;height:100%;object-fit:cover;display:block;}
.thlbl{font-size:9px;color:rgba(255,255,255,.85);letter-spacing:.04em;position:absolute;bottom:3px;left:50%;transform:translateX(-50%);white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.8);z-index:2;}
.thumb-placeholder{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,var(--pink-100),var(--blue-100));opacity:.6;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);}
.sb{border-left:1px solid var(--border);background:rgba(255,255,255,.65);backdrop-filter:blur(12px);display:flex;flex-direction:column;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--pink-100) transparent;}
.sb::-webkit-scrollbar{width:3px;}
.sb::-webkit-scrollbar-thumb{background:var(--pink-200);border-radius:2px;}
.sec{padding:18px 18px 14px;border-bottom:1px solid var(--border);}
.stitle{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--text-lt);margin-bottom:12px;display:flex;align-items:center;gap:7px;}
.stdot{width:5px;height:5px;border-radius:50%;background:var(--pink-200);flex-shrink:0;}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.scard{background:var(--cream);border:1px solid var(--border);border-radius:var(--r-md);padding:9px 11px;}
.slbl{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-lt);margin-bottom:3px;font-weight:500;}
.sval{font-family:var(--ff-d);font-size:20px;font-weight:300;color:var(--text);letter-spacing:-.01em;}
.su{font-size:10px;color:var(--text-lt);font-family:var(--ff-u);font-weight:400;}
.lttrack{width:100%;height:3px;background:var(--pink-50);border-radius:2px;margin-top:11px;overflow:hidden;}
.ltfill{height:100%;background:linear-gradient(to right,#7ecba1,var(--pink-200));border-radius:2px;width:20%;transition:width .5s,background .3s;}
.qlist{display:flex;flex-direction:column;gap:5px;}
.qi{display:flex;align-items:center;justify-content:space-between;padding:8px 11px;border-radius:var(--r-md);border:1px solid var(--border);cursor:pointer;transition:all var(--ease);background:var(--cream);}
.qi:hover{border-color:var(--pink-200);background:var(--pink-50);}
.qi.on{border-color:var(--pink-300);background:var(--pink-50);}
.qlbl{font-size:13px;font-weight:500;color:var(--text);}
.qsub{font-size:10px;color:var(--text-lt);margin-top:1px;}
.qbadge{font-size:9px;font-weight:600;letter-spacing:.1em;padding:3px 8px;border-radius:var(--r-pill);background:var(--blue-50);border:1px solid var(--blue-100);color:#185fa5;}
.qi.on .qbadge{background:var(--pink-100);border-color:var(--pink-200);color:#993556;}
.afeed{display:flex;flex-direction:column;gap:5px;max-height:150px;overflow-y:auto;scrollbar-width:none;}
.afeed::-webkit-scrollbar{display:none;}
.aitem{display:flex;gap:9px;align-items:flex-start;padding:7px 9px;background:var(--pink-50);border:1px solid var(--pink-100);border-radius:var(--r-md);animation:fup .3s ease;}
@keyframes fup{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.aico{width:22px;height:22px;border-radius:50%;background:var(--pink-100);border:1px solid var(--pink-200);display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;margin-top:1px;}
.albl{font-size:11px;font-weight:500;color:var(--text);}
.atm{font-size:10px;color:var(--text-lt);margin-top:2px;}
.noalert{font-size:11px;color:var(--text-lt);text-align:center;padding:14px 0;}
.seginfo{display:flex;flex-direction:column;gap:6px;}
.segrow{display:flex;justify-content:space-between;align-items:center;font-size:11px;}
.segk{color:var(--text-lt);}
.segv{font-weight:500;color:var(--text-mid);font-family:var(--ff-d);font-size:13px;}
.sbnote{padding:14px 18px;margin-top:auto;font-size:10px;color:var(--text-lt);line-height:1.7;}
.sflash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:9999;transition:opacity .08s;}
.sflash.on{opacity:.8;}
.clickplay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(18,8,22,.55);z-index:25;border-radius:var(--r-xl);cursor:pointer;}
.cpbtn{display:flex;flex-direction:column;align-items:center;gap:10px;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.25);border-radius:var(--r-xl);padding:20px 32px;color:rgba(255,255,255,.9);font-family:var(--ff-u);font-size:13px;font-weight:500;letter-spacing:.06em;cursor:pointer;transition:background var(--ease);}
.cpbtn:hover{background:rgba(255,255,255,.2);}
.toasts{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:7px;z-index:1000;}
.toast{background:#fff;border:1px solid var(--bmd);box-shadow:var(--sh-md);padding:8px 18px;border-radius:var(--r-pill);font-size:12px;font-weight:500;color:var(--text);animation:tpop .25s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;}
.toast.ok{border-color:#c4e6d0;color:#2a7a4b;}
.toast.warn{border-color:var(--pink-200);color:var(--pink-400);}
@keyframes tpop{from{opacity:0;transform:translateY(8px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(max-width:900px){.body{grid-template-columns:1fr;grid-template-rows:1fr auto;height:auto;overflow:auto;}.left{height:80vw;min-height:300px;}.sb{max-height:360px;border-left:none;border-top:1px solid var(--border);}}
</style>
</head>
<body>
<div class="sflash" id="sflash"></div>
<div class="toasts" id="toasts"></div>
<div class="shell">
  <header class="hdr">
    <div class="logo">
      <div class="logo-mark">
        <svg viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="9" cy="9" r="7.5" stroke="white" stroke-width="1.3" opacity=".9"/>
          <circle cx="6.5" cy="7.5" r="1" fill="white"/>
          <circle cx="11.5" cy="7.5" r="1" fill="white"/>
          <path d="M6 11 Q9 13.5 12 11" stroke="white" stroke-width="1.2" stroke-linecap="round" fill="none"/>
        </svg>
      </div>
      <div>
        <div class="logo-name">Zeynep and Aisha</div>
        <span class="logo-sub">Live Surveillance</span>
      </div>
    </div>
    <div class="hdr-pills">
      <div class="pill"><div class="pdot" id="sdot"></div><span id="slbl">Connecting</span></div>
      <div class="pill"><div class="pdot ok"></div><span>MPEG-DASH · H.264</span></div>
      <div class="pill"><div class="pdot ok"></div><span>MSE</span></div>
      <div class="hdr-clock" id="clk">--:--:--</div>
    </div>
  </header>
  <div class="body">
    <div class="left">
      <div class="vc">
        <div class="cn cn-tl"></div><div class="cn cn-tr"></div>
        <div class="cn cn-bl"></div><div class="cn cn-br"></div>
        <div class="mflash" id="mfl"></div>
        <div class="vtop">
          <div class="rec-tag" id="rectag"><div class="rdot"></div>Live</div>
          <div class="qtag" id="qtag">AUTO</div>
        </div>
        <div class="vosd">CAM-01 · <span id="osd">--:--:--</span></div>
        <div class="vload" id="vload">
          <div class="lring"></div>
          <div class="ltxt" id="ltxt">Connecting to stream…</div>
        </div>
        <div class="clickplay" id="clickplay" style="display:none;">
          <button class="cpbtn" id="cpbtn">
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none"><circle cx="14" cy="14" r="13" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/><polygon points="11,8 22,14 11,20" fill="white"/></svg>
            Tap to play
          </button>
        </div>
        <video id="vp" autoplay muted playsinline></video>
        <div class="cbar">
          <div class="pwrap" id="pw">
            <div class="pbuf" id="pb"></div>
            <div class="pfill" id="pf"><div class="pthumb"></div></div>
            <div class="stip" id="st">0:00</div>
          </div>
          <div class="crow">
            <button class="cb pk" id="bplay">▶ Play</button>
            <button class="cb bl" id="blive">● Live</button>
            <button class="cb" id="bback">↺ 10s</button>
            <button class="cb" id="bfwd">10s ↻</button>
            <div class="skwrap">
              <input type="text" id="skin" placeholder="0:00" maxlength="8">
              <button class="skgo" id="skgo">→</button>
            </div>
            <div class="ttxt" id="ttxt">0:00 / Live</div>
            <div class="csp"></div>
            🔊 <input type="range" class="vol" id="vol" min="0" max="1" step="0.05" value="0">
            <button class="cb" id="bsnap" title="Screenshot (S)">📷</button>
            <button class="cb" id="bfs" title="Fullscreen (F)">⛶</button>
          </div>
        </div>
      </div>
      <div class="tpanel">
        <div class="thdr">
          <div class="tlabel">Timeline</div>
          <div class="ttime" id="dvrinfo">DVR window loading…</div>
        </div>
        <div class="tstrip" id="tstrip"></div>
      </div>
    </div>
    <aside class="sb">
      <div class="sec">
        <div class="stitle"><div class="stdot"></div>Stream Stats</div>
        <div class="sgrid">
          <div class="scard"><div class="slbl">Bitrate</div><div class="sval" id="sbit">--<span class="su"> kbps</span></div></div>
          <div class="scard"><div class="slbl">Latency</div><div class="sval" id="slat">--<span class="su"> s</span></div></div>
          <div class="scard"><div class="slbl">Resolution</div><div class="sval" style="font-size:14px" id="sres">--</div></div>
          <div class="scard"><div class="slbl">Dropped</div><div class="sval" id="sdrop">0<span class="su"> fr</span></div></div>
        </div>
        <div class="lttrack"><div class="ltfill" id="ltf"></div></div>
      </div>
      <div class="sec">
        <div class="stitle"><div class="stdot" style="background:var(--blue-300)"></div>Quality</div>
        <div class="qlist" id="qlist">
          <!-- FIX #3: Populated dynamically after stream connects -->
          <div class="qi on" data-idx="-1">
            <div><div class="qlbl">Auto</div><div class="qsub">Waiting for stream…</div></div>
            <div class="qbadge">ABR</div>
          </div>
        </div>
      </div>
      <div class="sec">
        <div class="stitle"><div class="stdot"></div>Motion Alerts</div>
        <div class="afeed" id="afeed"><div class="noalert">No motion detected</div></div>
      </div>
      <div class="sec">
        <div class="stitle"><div class="stdot" style="background:var(--blue-200)"></div>Segment Info</div>
        <div class="seginfo">
          <div class="segrow"><span class="segk">Seg. duration</span><span class="segv" id="segd">-- s</span></div>
          <div class="segrow"><span class="segk">Buffer ahead</span><span class="segv" id="segb">-- s</span></div>
          <div class="segrow"><span class="segk">DVR window</span><span class="segv" id="segdvr">-- s</span></div>
          <div class="segrow"><span class="segk">Protocol</span><span class="segv">DASH</span></div>
        </div>
      </div>
      <div class="sbnote">Network Fundamentals · Project 2<br>H.264 · NGINX · dash.js MSE</div>
    </aside>
  </div>
</div>

<script>
(function(){
'use strict';

// ═══════════════════════════════════════════════════════════════════════════════
// FIX #1 — No hard-coded paths. All system-specific parameters come from URL
// query params or fall back to documented defaults.
// Usage:  http://localhost:8080/?mpd=dash/manifest.mpd&seg=4
// ═══════════════════════════════════════════════════════════════════════════════
const _params     = new URLSearchParams(location.search);
const MANIFEST    = _params.get('mpd')  || 'dash/manifest.mpd';
const SEG_DUR_CFG = parseInt(_params.get('seg') || '4', 10);
const POLL_MS     = 3000;

// ─── DOM refs ────────────────────────────────────────────────────────────────
const video  = document.getElementById('vp');
const vload  = document.getElementById('vload');
const ltxt   = document.getElementById('ltxt');
const pw     = document.getElementById('pw');
const pf     = document.getElementById('pf');
const pb     = document.getElementById('pb');
const st     = document.getElementById('st');
const ttxt   = document.getElementById('ttxt');
const osd    = document.getElementById('osd');
const rectag = document.getElementById('rectag');
const qtag   = document.getElementById('qtag');
const mfl    = document.getElementById('mfl');
const afeed  = document.getElementById('afeed');
const sdot   = document.getElementById('sdot');
const slbl   = document.getElementById('slbl');
const clk    = document.getElementById('clk');
const tstrip = document.getElementById('tstrip');
const sbit   = document.getElementById('sbit');
const slat   = document.getElementById('slat');
const sres   = document.getElementById('sres');
const sdrop  = document.getElementById('sdrop');
const ltf    = document.getElementById('ltf');
const segb   = document.getElementById('segb');
const segdvr = document.getElementById('segdvr');
const dvrinfo= document.getElementById('dvrinfo');
const segd   = document.getElementById('segd');
const qlist  = document.getElementById('qlist');
const bplay  = document.getElementById('bplay');
const blive  = document.getElementById('blive');
const bback  = document.getElementById('bback');
const bfwd   = document.getElementById('bfwd');
const skin   = document.getElementById('skin');
const skgo   = document.getElementById('skgo');
const vol    = document.getElementById('vol');
const bsnap  = document.getElementById('bsnap');
const bfs    = document.getElementById('bfs');

// ─── FIX #5 — Segment duration from config param, not hardcoded HTML ────────
segd.textContent = SEG_DUR_CFG + ' s';

// ─── Clock ───────────────────────────────────────────────────────────────────
function tick(){ const t = new Date().toTimeString().slice(0,8); clk.textContent = osd.textContent = t; }
setInterval(tick, 1000); tick();

// ─── State ───────────────────────────────────────────────────────────────────
let player       = null;
let timeShifting = false;
let retryCount   = 0;
let thumbFrames  = [];     // FIX #6: stores {time, dataURL} for thumbnail frames
let isSeeking    = false;  // FIX: prevents timeupdate from fighting seeks
let dvrStart     = null;   // FIX: anchor DVR start so bar doesn't jump as window slides

// ─── Intercept playbackRate ───────────────────────────────────────────────────
// dash.js catch-up raises playbackRate > 1. When user is time-shifting we
// clamp it so the stream doesn't auto-race back to live.
(function interceptPlaybackRate(vid){
  const proto = Object.getOwnPropertyDescriptor(HTMLMediaElement.prototype, 'playbackRate');
  if(!proto) return;
  Object.defineProperty(vid, 'playbackRate', {
    get(){ return proto.get.call(this); },
    set(val){
      if(timeShifting && val > 1.0) val = 1.0;
      proto.set.call(this, val);
    },
    configurable: true
  });
})(video);

// ─── FIX #10 — Volume slider starts at 0 (matching the muted video element) ─
// The <video> element has the muted attribute for autoplay policy compliance.
// We reflect that in the slider so there is no visual lie (slider=1, sound=off).
vol.value = '0';
video.muted  = true;
video.volume = 1.0;   // real volume ready for when the user unmutes

// ═══════════════════════════════════════════════════════════════════════════════
// INIT — Create and configure the dash.js player
// ═══════════════════════════════════════════════════════════════════════════════
function init(){
  if(typeof MediaSource === 'undefined'){
    ltxt.textContent = 'MSE not supported in this browser.';
    return;
  }

  player = dashjs.MediaPlayer().create();

  // Live catch-up tuning — keep us close to the live edge but not jarring
  try {
    player.updateSettings({
      streaming: {
        liveCatchup: { enabled:true, minDrift:0.05, playbackRate:{ min:0, max:0.5 } },
        retryAttempts:  { MPD:10, MediaSegment:10 },
        retryIntervals: { MPD:1000, MediaSegment:1000 }
      }
    });
  } catch(_) {}

  player.initialize(video, MANIFEST, true);

  // Autoplay — present an overlay if autoplay is blocked
  video.addEventListener('canplay', () => {
    const p = video.play();
    if(p !== undefined){
      p.catch(() => {
        const ov = document.getElementById('clickplay');
        if(ov) ov.style.display = 'flex';
      });
    }
  }, { once: true });

  // Manual play-button overlay (mobile tap-to-play)
  const cpbtn    = document.getElementById('cpbtn');
  const clickplay= document.getElementById('clickplay');
  if(cpbtn && clickplay){
    cpbtn.addEventListener('click', () => {
      video.muted = false;
      vol.value   = video.volume.toString();
      video.play()
        .then(() => { clickplay.style.display = 'none'; })
        .catch(() => {
          video.muted = true;
          vol.value   = '0';
          video.play().then(() => { clickplay.style.display = 'none'; });
        });
    });
  }

  // ─ STREAM_INITIALIZED ──────────────────────────────────────────────────────
  player.on(dashjs.MediaPlayer.events.STREAM_INITIALIZED, () => {
    retryCount = 0;
    dvrStart = null;   // reset anchor so it re-captures on first timeupdate
    vload.classList.add('gone');
    rectag.classList.add('on');
    setst('live', 'Live');
    buildQualityList();   // FIX #3
    buildThumbs();        // FIX #6
    toast('Stream connected', 'ok');
  });

  // ─ FIX #2 + #4 — Update resolution stat and qtag on quality change ─────────
  player.on(dashjs.MediaPlayer.events.QUALITY_CHANGE_RENDERED, (e) => {
    if(e.mediaType !== 'video') return;
    try {
      const bList = player.getBitrateInfoListFor('video');
      const idx   = player.getQualityFor('video');
      if(bList && bList[idx]){
        const q = bList[idx];
        // Update Resolution stat card
        sres.innerHTML = q.width + '<span class="su">×</span>' + q.height;
        // Update quality badge in video overlay
        qtag.textContent = (q.height || (idx + 1)) + 'p';
      }
    } catch(_) {
      // Fallback: read directly from the video element dimensions
      if(video.videoWidth){
        sres.innerHTML = video.videoWidth + '<span class="su">×</span>' + video.videoHeight;
      }
    }
    // Highlight the active item in the quality selector
    updateQualityHighlight(player.getQualityFor('video'));
  });

  // ─ FIX #9 — Error recovery: reset and re-initialize with backoff ──────────
  player.on(dashjs.MediaPlayer.events.ERROR, (e) => {
    retryCount++;
    const delay = Math.min(1000 * retryCount, 10000);   // 1s, 2s, … capped at 10s
    ltxt.textContent = 'Stream error — retrying in ' + (delay/1000).toFixed(0) + 's…';
    vload.classList.remove('gone');
    setst('', 'Error');
    toast('Stream error: ' + (e.error?.code || '?'), 'warn');

    setTimeout(() => {
      ltxt.textContent = 'Reconnecting…';
      try { player.reset(); } catch(_) {}
      try { player.initialize(video, MANIFEST, true); } catch(_) {}
    }, delay);
  });

  player.on(dashjs.MediaPlayer.events.PLAYBACK_STARTED, () => { retryCount = 0; syncbtn(); });
  player.on(dashjs.MediaPlayer.events.PLAYBACK_PAUSED,  syncbtn);
}

// ─── Status dot helper ───────────────────────────────────────────────────────
function setst(s, l){
  sdot.className = 'pdot' + (s === 'live' ? ' live' : s === 'ok' ? ' ok' : '');
  slbl.textContent = l;
}

// ═══════════════════════════════════════════════════════════════════════════════
// FIX #3 — Quality selector: dynamically built from dash.js bitrate list
// ═══════════════════════════════════════════════════════════════════════════════
function buildQualityList(){
  let bList = [];
  try { bList = player.getBitrateInfoListFor('video') || []; } catch(_) {}

  qlist.innerHTML = '';

  // ── Auto (ABR) option ──────────────────────────────────────────────────────
  const autoEl = makeQualityItem(-1, 'Auto', 'Adaptive bitrate', 'ABR');
  autoEl.addEventListener('click', () => {
    try {
      player.updateSettings({ streaming:{ abr:{ autoSwitchBitrate:{ video:true } } } });
    } catch(_) {}
    qtag.textContent = 'AUTO';
    updateQualityHighlight(-1);
    toast('Quality: Auto (ABR)', 'ok');
  });
  qlist.appendChild(autoEl);

  // ── One entry per rendition ────────────────────────────────────────────────
  if(bList.length > 0){
    bList.forEach((b, i) => {
      const label = b.height ? b.height + 'p' : 'Level ' + (i + 1);
      const sub   = Math.round((b.bitrate || 0) / 1000) + ' kbps';
      const el    = makeQualityItem(i, label, sub, label);
      el.addEventListener('click', () => {
        try {
          player.updateSettings({ streaming:{ abr:{ autoSwitchBitrate:{ video:false } } } });
          player.setQualityFor('video', i, true);
        } catch(_) {}
        qtag.textContent = label;
        updateQualityHighlight(i);
        toast('Quality locked to ' + label, 'ok');
      });
      qlist.appendChild(el);
    });
  }

  updateQualityHighlight(-1);   // start on Auto
}

function makeQualityItem(idx, label, sub, badge){
  const el = document.createElement('div');
  el.className   = 'qi';
  el.dataset.idx = idx;
  el.innerHTML   =
    '<div><div class="qlbl">' + label + '</div>' +
    '<div class="qsub">'  + sub   + '</div></div>' +
    '<div class="qbadge">' + badge + '</div>';
  return el;
}

function updateQualityHighlight(activeIdx){
  qlist.querySelectorAll('.qi').forEach(el => {
    el.classList.toggle('on', parseInt(el.dataset.idx, 10) === activeIdx);
  });
}

// ═══════════════════════════════════════════════════════════════════════════════
// Time-shift helpers
// ═══════════════════════════════════════════════════════════════════════════════
function startTimeShift(){ timeShifting = true;  video.playbackRate = 1.0; }
function stopTimeShift() { timeShifting = false; }

// ═══════════════════════════════════════════════════════════════════════════════
// FIX #8 — getDvrRange: safe for both player.duration() (function) and
//           player.duration (property), whichever the dash.js version exposes.
// ═══════════════════════════════════════════════════════════════════════════════
function getDvrRange(){
  // Prefer the browser's seekable range — always correct for live DVR
  if(video.seekable && video.seekable.length > 0){
    const i = video.seekable.length - 1;
    return { start: video.seekable.start(i), end: video.seekable.end(i) };
  }
  // Fallback: ask dash.js (handle both property and method variants)
  try {
    const rawDur = player && player.duration;
    const end = typeof rawDur === 'function'
      ? rawDur.call(player)
      : (rawDur != null ? rawDur : video.currentTime);
    const dvr = (player && typeof player.getDVRWindowSize === 'function')
      ? (player.getDVRWindowSize() || 40) : 40;
    return { start: Math.max(0, end - dvr), end };
  } catch(_) {
    return { start: 0, end: Math.max(video.currentTime, 1) };
  }
}

function seekLiveSafe(target){
  const r = getDvrRange();
  const safeTarget = Math.max(r.start, Math.min(target, r.end - 0.5));
  isSeeking = true;
  // Only call player.seek — setting video.currentTime directly fights dash.js
  // and causes the ~1s seek error. player.seek() is the correct API for DASH.
  if(player && typeof player.seek === 'function'){
    try { player.seek(safeTarget); } catch(_) {}
  } else {
    // Fallback for browsers where player.seek isn't available
    try { video.currentTime = safeTarget; } catch(_) {}
  }
  video.play().catch(() => {});
  // Release the seeking lock after dash.js has had time to settle
  setTimeout(() => { isSeeking = false; }, 800);
}

// ═══════════════════════════════════════════════════════════════════════════════
// Progress bar + FIX #7 — auto-reset timeShifting when back at live edge
// ═══════════════════════════════════════════════════════════════════════════════
video.addEventListener('timeupdate', () => {
  // Don't fight an in-progress seek — skip updates until it settles
  if(isSeeking) return;

  const r   = getDvrRange();

  // Anchor dvrStart on first valid range so the bar doesn't jump backward
  // as the live window slides forward (r.start creeps up every few seconds)
  if(dvrStart === null && r.end > r.start) dvrStart = r.start;
  const start = dvrStart !== null ? dvrStart : r.start;

  const d   = Math.max(1, r.end - start);
  const c   = Math.max(start, Math.min(video.currentTime, r.end));
  const pct = ((c - start) / d) * 100;

  pf.style.width  = Math.min(100, Math.max(0, pct)) + '%';
  pb.style.width  = '100%';
  ttxt.textContent = fmt(c - start) + ' / DVR ' + fmt(d);
  hiThumb(c - start, d);

  // FIX #7: Auto-reset time-shift mode when within 2 s of the live edge
  if(timeShifting && c >= r.end - 2.0){
    stopTimeShift();
  }

  // FIX #2: Update resolution from video element if not yet set by quality event
  if(sres.textContent === '--' && video.videoWidth){
    sres.innerHTML = video.videoWidth + '<span class="su">×</span>' + video.videoHeight;
  }
});

// Progress bar hover tooltip
pw.addEventListener('mousemove', e => {
  const rct = pw.getBoundingClientRect();
  const f   = Math.max(0, Math.min(1, (e.clientX - rct.left) / rct.width));
  const r   = getDvrRange();
  const start = dvrStart !== null ? dvrStart : r.start;
  st.style.left  = (f * 100) + '%';
  st.textContent = fmt(f * (r.end - start));
});

// Progress bar click → seek
pw.addEventListener('click', e => {
  if(!player) return;
  const rct = pw.getBoundingClientRect();
  const f   = Math.max(0, Math.min(1, (e.clientX - rct.left) / rct.width));
  const r   = getDvrRange();
  const start = dvrStart !== null ? dvrStart : r.start;
  const d   = Math.max(1, r.end - start);
  startTimeShift();
  seekLiveSafe(start + f * d);
});

// ═══════════════════════════════════════════════════════════════════════════════
// FIX #11 — Stats poller: throughput API compatible with dash.js 3.x and 4.x
// ═══════════════════════════════════════════════════════════════════════════════
setInterval(() => {
  if(!player) return;

  // Bitrate (try both API variants)
  try {
    let bw = 0;
    if(typeof player.getAverageThroughput === 'function'){
      bw = player.getAverageThroughput('video');
    } else if(typeof player.getAverageThroughputByType === 'function'){
      bw = player.getAverageThroughputByType('video');
    }
    if(bw > 0) sbit.innerHTML = Math.round(bw / 1000) + '<span class="su"> kbps</span>';
  } catch(_) {}

  // Latency
  try {
    const lat = player.getCurrentLiveLatency();
    if(!isNaN(lat)){
      slat.innerHTML = lat.toFixed(1) + '<span class="su"> s</span>';
      const p = Math.min(100, (lat / 10) * 100);
      ltf.style.width = p + '%';
      ltf.style.background =
        lat < 3 ? 'linear-gradient(to right,#7ecba1,var(--blue-200))'  :
        lat < 6 ? 'linear-gradient(to right,var(--blue-200),var(--pink-200))' :
                  'linear-gradient(to right,var(--pink-200),var(--pink-400))';
    }
  } catch(_) {}

  // Buffer ahead
  try {
    if(video.buffered.length > 0){
      segb.textContent = (video.buffered.end(video.buffered.length - 1) - video.currentTime).toFixed(1) + ' s';
    }
  } catch(_) {}

  // Dropped frames
  try {
    if(video.getVideoPlaybackQuality){
      sdrop.innerHTML = video.getVideoPlaybackQuality().droppedVideoFrames + '<span class="su"> fr</span>';
    }
  } catch(_) {}

  // DVR window size
  try {
    const dvr = player.getDVRWindowSize();
    if(dvr){
      segdvr.textContent = Math.round(dvr) + ' s';
      dvrinfo.textContent = 'DVR window: ' + Math.round(dvr) + 's';
    }
  } catch(_) {}

  // FIX #5: Attempt to read segment duration from MPD via dash.js stream info
  try {
    const si = player.getActiveStream && player.getActiveStream();
    if(si){
      const info = si.getStreamInfo && si.getStreamInfo();
      if(info && info.manifestInfo && info.manifestInfo.minBufferTime){
        // minBufferTime is a proxy for segment duration in DASH
        segd.textContent = SEG_DUR_CFG + ' s';  // keep URL param as authoritative
      }
    }
  } catch(_) {}

}, 1500);

// ═══════════════════════════════════════════════════════════════════════════════
// FIX #6 — Thumbnail strip with real canvas-captured frames
// Strategy: capture the current video frame every 12 s and associate it with
// the current DVR offset. When rendering thumbs we use the nearest capture.
// This is the only feasible client-side approach for a live stream (seeking to
// capture different times would interrupt playback).
// ═══════════════════════════════════════════════════════════════════════════════
function buildThumbs(){
  tstrip.innerHTML = '';
  for(let i = 0; i < 10; i++){
    const div  = document.createElement('div');
    div.className   = 'thumb';
    div.dataset.i   = i;

    // Canvas element for real frame rendering
    const cv  = document.createElement('canvas');
    cv.width  = 140; cv.height = 80;    // 2× for sharpness on HiDPI
    cv.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;';
    div.appendChild(cv);

    // Placeholder shown until first frame is captured
    const ph  = document.createElement('div');
    ph.className = 'thumb-placeholder';
    div.appendChild(ph);

    const lbl = document.createElement('div');
    lbl.className = 'thlbl';
    lbl.textContent = '—:——';
    div.appendChild(lbl);

    div.addEventListener('click', () => {
      if(!player) return;
      const r = getDvrRange();
      const t = r.start + (i / 9) * (r.end - r.start);
      startTimeShift();
      seekLiveSafe(t);
      toast('Seeking inside DVR window', 'ok');
    });

    tstrip.appendChild(div);
  }
}

// Periodically capture the current frame and add it to thumbFrames
function captureFrame(){
  if(!player || video.videoWidth === 0) return;
  const r = getDvrRange();
  const t = video.currentTime - r.start;   // offset within DVR window
  if(t < 0) return;

  const cv  = document.createElement('canvas');
  cv.width  = 140; cv.height = 80;
  const ctx = cv.getContext('2d');
  try { ctx.drawImage(video, 0, 0, cv.width, cv.height); } catch(_) { return; }

  thumbFrames.push({ t, url: cv.toDataURL('image/jpeg', 0.6) });

  // Keep only the most recent 30 frames (~6 minutes at 12s intervals)
  if(thumbFrames.length > 30) thumbFrames.shift();

  renderThumbs();
}

function renderThumbs(){
  const thumbEls = tstrip.querySelectorAll('.thumb');
  if(!thumbEls.length || !player) return;
  const r = getDvrRange();
  const d = Math.max(1, r.end - r.start);

  thumbEls.forEach((th, i) => {
    const targetT = (i / (thumbEls.length - 1)) * d;
    th.querySelector('.thlbl').textContent = fmt(targetT);

    // Find the closest captured frame
    if(thumbFrames.length === 0) return;
    let best = thumbFrames[0], bestDist = Infinity;
    thumbFrames.forEach(f => {
      const dist = Math.abs(f.t - targetT);
      if(dist < bestDist){ bestDist = dist; best = f; }
    });

    const cv  = th.querySelector('canvas');
    const ph  = th.querySelector('.thumb-placeholder');
    if(!cv) return;

    const img = new Image();
    img.onload = () => {
      const ctx = cv.getContext('2d');
      ctx.drawImage(img, 0, 0, cv.width, cv.height);
      // Subtle dark gradient at bottom for label readability
      const grad = ctx.createLinearGradient(0, cv.height * 0.55, 0, cv.height);
      grad.addColorStop(0, 'transparent');
      grad.addColorStop(1, 'rgba(0,0,0,0.55)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, cv.width, cv.height);
      if(ph) ph.style.display = 'none';
    };
    img.src = best.url;
  });
}

// Capture a frame every 12 seconds once the stream is live
setInterval(() => { if(player) captureFrame(); }, 12000);

function hiThumb(c, d){
  const ts = tstrip.querySelectorAll('.thumb');
  if(!d || !ts.length) return;
  const cx = Math.round((c / d) * (ts.length - 1));
  ts.forEach((t, i) => t.classList.toggle('on', i === cx));
}

// ═══════════════════════════════════════════════════════════════════════════════
// Control bar — Play/Pause, Live, Rewind, Forward, Seek input
// ═══════════════════════════════════════════════════════════════════════════════
bplay.addEventListener('click', () => { video.paused ? video.play() : video.pause(); });

function syncbtn(){
  bplay.textContent = video.paused ? '▶ Play' : '⏸ Pause';
  bplay.classList.toggle('pk', !video.paused);
}
video.addEventListener('play',  syncbtn);
video.addEventListener('pause', syncbtn);

blive.addEventListener('click', () => {
  if(!player) return;
  stopTimeShift();
  const r = getDvrRange();
  seekLiveSafe(r.end - 0.5);
  toast('Jumped to live edge', 'ok');
});

bback.addEventListener('click', () => {
  if(!player) return;
  const r = getDvrRange();
  const start = dvrStart !== null ? dvrStart : r.start;
  startTimeShift();
  seekLiveSafe(Math.max(start, video.currentTime - 10));
  toast('Rewound 10 seconds', 'ok');
});

bfwd.addEventListener('click', () => {
  if(!player) return;
  const r = getDvrRange();
  const target = video.currentTime + 10;
  if(target >= r.end - 1){
    stopTimeShift();
    seekLiveSafe(r.end - 0.5);
    toast('Returned to live edge', 'ok');
  } else {
    startTimeShift();
    seekLiveSafe(target);
    toast('Forwarded 10 seconds', 'ok');
  }
});

function doSeek(){
  const s = parseT(skin.value.trim());
  if(isNaN(s)){ toast('Invalid time — use 0:00 or seconds', 'warn'); return; }
  if(!player) return;
  const r = getDvrRange();
  const clamped = Math.min(s, r.end - r.start);   // clamp to DVR window length
  startTimeShift();
  seekLiveSafe(r.start + clamped);
  toast('Seeking to ' + fmt(clamped) + ' inside DVR window', 'ok');
}
skgo.addEventListener('click', doSeek);
skin.addEventListener('keydown', e => { if(e.key === 'Enter') doSeek(); });

// ─── FIX #10 — Volume slider: syncs with video.muted and video.volume ────────
vol.addEventListener('input', () => {
  const v = parseFloat(vol.value);
  video.volume = v > 0 ? v : 0;
  video.muted  = (v === 0);
});

// ─── Fullscreen ──────────────────────────────────────────────────────────────
bfs.addEventListener('click', () => {
  const el = document.querySelector('.vc');
  document.fullscreenElement ? document.exitFullscreen() : el.requestFullscreen().catch(() => {});
});

// ═══════════════════════════════════════════════════════════════════════════════
// Screenshot — Canvas capture of the current video frame
// ═══════════════════════════════════════════════════════════════════════════════
function snap(){
  if(!video.videoWidth){ toast('No video frame yet', 'warn'); return; }
  const cv  = document.createElement('canvas');
  cv.width  = video.videoWidth  || 1280;
  cv.height = video.videoHeight || 720;
  const ctx = cv.getContext('2d');
  ctx.drawImage(video, 0, 0, cv.width, cv.height);

  // Watermark
  const ts = new Date().toISOString().replace('T',' ').slice(0,19);
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(0, cv.height - 26, 240, 26);
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  ctx.font = '11px monospace';
  ctx.fillText('H&A · ' + ts, 10, cv.height - 9);

  const a       = document.createElement('a');
  a.download    = 'HA_snapshot_' + Date.now() + '.jpg';
  a.href        = cv.toDataURL('image/jpeg', 0.92);
  a.click();

  document.getElementById('sflash').classList.add('on');
  setTimeout(() => document.getElementById('sflash').classList.remove('on'), 150);
  toast('Screenshot saved', 'ok');
}
bsnap.addEventListener('click', snap);

// ═══════════════════════════════════════════════════════════════════════════════
// Motion alert polling
// ═══════════════════════════════════════════════════════════════════════════════
let lastAlerts = 0;
async function pollAlerts(){
  try {
    const r = await fetch('motion_alerts.json?t=' + Date.now());
    if(!r.ok) return;
    const data = await r.json();
    if(!Array.isArray(data)) return;
    if(data.length > lastAlerts){
      data.slice(lastAlerts).forEach(addAlert);
      mfl.classList.add('on');
      setTimeout(() => mfl.classList.remove('on'), 400);
      toast('⚠ Motion detected!', 'warn');
    }
    lastAlerts = data.length;
    if(data.length && afeed.querySelector('.noalert')){
      afeed.innerHTML = '';
      data.slice(0, 8).forEach(addAlert);
    }
  } catch(_) {}
}
function addAlert(a){
  const no = afeed.querySelector('.noalert');
  if(no) afeed.innerHTML = '';
  const t  = (a.time || '').replace('T',' ').slice(0,19);
  const el = document.createElement('div');
  el.className  = 'aitem';
  el.innerHTML  = '<div class="aico">⚠</div><div><div class="albl">Motion detected</div><div class="atm">' + (t||'--') + '</div></div>';
  afeed.insertBefore(el, afeed.firstChild);
  while(afeed.childElementCount > 20) afeed.removeChild(afeed.lastChild);
}
setInterval(pollAlerts, POLL_MS);

// ─── Keyboard shortcuts ───────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if(e.target.tagName === 'INPUT') return;
  if(e.key === ' ')                 { e.preventDefault(); bplay.click(); }
  if(e.key === 'l' || e.key === 'L') blive.click();
  if(e.key === 'ArrowLeft')          bback.click();
  if(e.key === 'ArrowRight')         bfwd.click();
  if(e.key === 's' || e.key === 'S') snap();
  if(e.key === 'f' || e.key === 'F') bfs.click();
});

// ─── Toast helper ─────────────────────────────────────────────────────────────
function toast(msg, type = ''){
  const el = document.createElement('div');
  el.className  = 'toast' + (type ? ' ' + type : '');
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

// ─── Formatting helpers ───────────────────────────────────────────────────────
function fmt(s){
  if(!isFinite(s) || isNaN(s)) return '0:00';
  const h  = Math.floor(s / 3600);
  const m  = Math.floor((s % 3600) / 60);
  const sc = Math.floor(s % 60);
  return h > 0 ? h + ':' + pad(m) + ':' + pad(sc) : m + ':' + pad(sc);
}
function pad(n){ return String(n).padStart(2, '0'); }
function parseT(r){
  if(!r) return NaN;
  if(r.includes(':')){
    const p = r.split(':').map(Number);
    if(p.some(isNaN)) return NaN;
    return p.length === 3 ? p[0]*3600 + p[1]*60 + p[2] : p[0]*60 + p[1];
  }
  return parseFloat(r);
}

init();
})();
</script>
